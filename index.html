<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Frases Bíblicas - Nabby Ministerio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #f3f4f6; 
        }
        .font-serif-quote { 
            font-family: 'Playfair Display', serif; 
        }

        /* Contenedor Cuadrado de la Imagen (1:1) */
        .post-container {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-radius: 1rem;
            transition: background 0.5s ease;
            color: #ffffff; /* Texto siempre blanco para los tonos medios/oscuros */
        }

        .quote-text {
            font-size: clamp(1.15rem, 4.5vw, 1.35rem);
            line-height: 1.45;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .quote-marks::before {
            content: '“';
            font-size: 4rem;
            opacity: 0.15;
            position: absolute;
            top: -2.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: serif;
        }
        
        .quote-marks::after {
            content: '”';
            font-size: 4rem;
            opacity: 0.15;
            position: absolute;
            bottom: -3.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: serif;
        }

        /* Notificación Toast */
        #toast {
            visibility: hidden;
            min-width: 280px;
            background-color: #374151;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 50;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
            font-size: 0.875rem;
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
        #toast.error { background-color: #EF4444; }
        #toast.success { background-color: #10B981; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4 text-gray-800">

    <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl overflow-hidden">
        
        <!-- Header & Tabs -->
        <div class="bg-white pt-6 px-6 border-b border-gray-100">
            <div class="text-center space-y-1 mb-6">
                <h1 class="text-2xl font-bold text-gray-800">Nabby Ministerio</h1>
                <p class="text-gray-500 text-sm">Reflexión Diaria</p>
            </div>
            
            <div class="flex gap-4 justify-center">
                <button id="tab-hoy" class="px-6 py-2 border-b-2 border-blue-600 text-blue-600 font-bold transition-colors">Hoy</button>
                <button id="tab-pasadas" class="px-6 py-2 border-b-2 border-transparent text-gray-400 hover:text-gray-700 font-bold transition-colors">Pasadas</button>
            </div>
        </div>

        <div class="p-5 md:p-6 bg-gray-50/50">
            <!-- VISTA: HOY -->
            <div id="view-hoy" class="space-y-5 flex flex-col items-center animate-fade-in">
                
                <div class="w-full text-center text-sm font-bold text-gray-400 tracking-wider uppercase mb-1">
                    <span id="display-date-label">Frase del Día</span>
                </div>

                <!-- CONTENEDOR A CAPTURAR (Aspect Ratio 1:1) -->
                <div id="post-capture-area" class="post-container">
                    
                    <div class="relative w-full px-2 mt-2">
                        <p id="post-message" class="font-serif-quote italic font-semibold quote-text relative quote-marks">
                            Cargando frase...
                        </p>
                    </div>
                    
                    <div id="post-reference" class="mt-6 text-[0.65rem] font-bold uppercase tracking-widest bg-black/25 px-4 py-1.5 rounded-full backdrop-blur-sm shadow-sm text-white/90">
                        Referencia
                    </div>

                    <!-- Marca de agua -->
                    <div class="absolute bottom-4 w-full text-center opacity-80 font-sans px-4 text-white drop-shadow-md" style="font-size: 0.65rem; line-height: 1.3;">
                        <span class="font-bold text-[0.7rem]">Nabby Ministerio.</span><br>
                        #NecesitoDeDios #PalabradeDiosParami
                    </div>
                </div>

                <!-- Botones de Acción -->
                <div class="w-full grid grid-cols-2 gap-3 mt-2">
                    <button id="copyBtn" class="flex flex-col items-center justify-center gap-1 p-3 bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 font-semibold rounded-xl shadow-sm transition active:scale-95 text-xs">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        Copiar
                    </button>
                    
                    <button id="downloadBtn" class="flex flex-col items-center justify-center gap-1 p-3 bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 font-semibold rounded-xl shadow-sm transition active:scale-95 text-xs">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-500"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Descargar
                    </button>
                    
                    <button id="shareBtn" class="col-span-2 flex items-center justify-center gap-2 p-3.5 bg-gray-900 hover:bg-gray-800 text-white font-semibold rounded-xl shadow-md transition active:scale-95 text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                        Compartir (WA, IG, FB)
                    </button>
                </div>
            </div>

            <!-- VISTA: PASADAS -->
            <div id="view-pasadas" class="hidden">
                <p class="text-xs text-gray-500 mb-4 text-center font-medium">Selecciona un día anterior para cargarlo en el editor.</p>
                <div id="past-grid" class="grid grid-cols-2 gap-3 max-h-[60vh] overflow-y-auto p-1 no-scrollbar">
                    <!-- Cards dinámicos -->
                </div>
                <div id="no-past-msg" class="hidden text-center text-gray-400 py-10 font-medium text-sm">
                    Aún no hay frases pasadas para mostrar.
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast">Notificación</div>

    <script>
        // Base de datos de frases (29 Sept - 7 Ene)
        const quotes = [
            { m: 9, d: 29, msg: "Aunque hoy sientas que tus fuerzas se agotan, Dios te da el poder interno para superar cualquier adversidad.", ref: "Filipenses 4:13" },
            { m: 9, d: 30, msg: "Dios tiene un diseño compasivo para tu vida; incluso en la incertidumbre, Él traza tu camino hacia la esperanza.", ref: "Jeremías 29:11" },
            { m: 10, d: 1, msg: "Cuando confías plenamente en Dios, todas las piezas de tu historia, incluso las dolorosas, se unen para tu mayor bien.", ref: "Romanos 8:28" },
            { m: 10, d: 2, msg: "No te apoyes solo en tu propia lógica; deja que Dios guíe tu corazón y Él enderezará cada uno de tus pasos.", ref: "Proverbios 3:5-6" },
            { m: 10, d: 3, msg: "No le temas a lo desconocido; Dios es tu fortaleza, Él te sostiene y camina a tu lado en cada momento.", ref: "Isaías 41:10" },
            { m: 10, d: 4, msg: "Si permites que Dios sea tu guía, te darás cuenta de que, en esencia, no te falta absolutamente nada para estar completo.", ref: "Salmo 23:1" },
            { m: 10, d: 5, msg: "Si llevas una carga demasiado pesada, acércate a Dios. En Él, tu alma cansada encontrará un verdadero descanso.", ref: "Mateo 11:28" },
            { m: 10, d: 6, msg: "Dios no te creó para vivir paralizado por el miedo, sino que te equipó con poder, amor incondicional y claridad mental.", ref: "2 Timoteo 1:7" },
            { m: 10, d: 7, msg: "En medio de la tormenta, Dios es tu mayor refugio; Él es tu auxilio inmediato cuando el mundo entero tiembla.", ref: "Salmo 46:1" },
            { m: 10, d: 8, msg: "Dios te regala una paz que supera la lógica del mundo; no dejes que el temor te la robe ni perturbe tu corazón.", ref: "Juan 14:27" },
            { m: 10, d: 9, msg: "Aquellos que esperan con paciencia en Dios renuevan sus alas, se elevan por encima del cansancio y caminan sin rendirse.", ref: "Isaías 40:31" },
            { m: 10, d: 10, msg: "Deja que todas tus acciones, inspiradas por el amor que Dios te ha mostrado, estén impregnadas de una bondad genuina.", ref: "1 Corintios 16:14" },
            { m: 10, d: 11, msg: "Cuando camines por los valles más oscuros de la vida, no hay razón para temer, pues la presencia de Dios camina contigo.", ref: "Salmo 23:4" },
            { m: 10, d: 12, msg: "Antes de que fueras formado, Dios ya te conocía; naciste con un propósito sagrado y un valor incalculable para Él.", ref: "Jeremías 1:5" },
            { m: 10, d: 13, msg: "El llanto puede durar toda una noche, pero Dios asegura que el amanecer siempre traerá consigo un nuevo motivo de alegría.", ref: "Salmo 30:5" },
            { m: 10, d: 14, msg: "Cuida profundamente tus pensamientos, porque es ahí donde Dios siembra las semillas que determinan el rumbo de tu vida.", ref: "Proverbios 4:23" },
            { m: 10, d: 15, msg: "Dios es luz, y si caminas cerca de Él, descubrirás que ninguna oscuridad, por densa que sea, tiene el poder de apagarte.", ref: "Juan 1:5" },
            { m: 10, d: 16, msg: "Sé valiente y mantén la firmeza; no te desanimes, porque Dios camina a tu lado en cada paso de este viaje.", ref: "Josué 1:9" },
            { m: 10, d: 17, msg: "Cuando la ansiedad intente multiplicar el caos en tu mente, busca el consuelo de Dios; Él devolverá la alegría a tu alma.", ref: "Salmo 94:19" },
            { m: 10, d: 18, msg: "Todo tiene su momento perfecto en el plan de Dios. Aprende a fluir con el ritmo que Él ha establecido bajo el cielo.", ref: "Eclesiastés 3:1" },
            { m: 10, d: 19, msg: "Pide a Dios con un corazón abierto y se te dará; busca con intención y Él abrirá la puerta correcta en tu vida.", ref: "Mateo 7:7" },
            { m: 10, d: 20, msg: "No te amoldes a las ideas rotas de este mundo; deja que Dios renueve tu mente para que descubras Su voluntad perfecta.", ref: "Romanos 12:2" },
            { m: 10, d: 21, msg: "La fe es tener la certeza en las promesas de Dios, sabiendo que lo que aún no ves ya está en camino.", ref: "Hebreos 11:1" },
            { m: 10, d: 22, msg: "El amor de Dios en ti es paciente y amable; perdona, no guarda rencor y te enseña a celebrar siempre la verdad.", ref: "1 Corintios 13:4-7" },
            { m: 10, d: 23, msg: "Entrega tus preocupaciones a Dios y confía; Él sostendrá tu carga y evitará que tus pasos resbalen.", ref: "Salmo 55:22" },
            { m: 10, d: 24, msg: "Así como el oro se purifica en el fuego, Dios prueba y moldea tu corazón en la adversidad para revelar tu verdadera fuerza.", ref: "Proverbios 17:3" },
            { m: 10, d: 25, msg: "No permitas que el sol se ponga mientras aún guardes enojo; perdona rápido, tal como Dios te perdona a ti.", ref: "Efesios 4:26" },
            { m: 10, d: 26, msg: "Tu cuerpo es templo del Espíritu de Dios; trátalo con el respeto, el cuidado y la dignidad que merece lo sagrado.", ref: "1 Corintios 6:19" },
            { m: 10, d: 27, msg: "Dios es justo: aquello que siembres hoy con tus palabras y acciones, es exactamente el fruto que cosecharás mañana.", ref: "Gálatas 6:7" },
            { m: 10, d: 28, msg: "Una palabra amable tiene el poder de calmar la furia; permite que la sabiduría de Dios guíe tus respuestas.", ref: "Proverbios 15:1" },
            { m: 10, d: 29, msg: "El amigo genuino, puesto por Dios en tu camino, ama en todo momento y en la angustia se convierte en un verdadero hermano.", ref: "Proverbios 17:17" },
            { m: 10, d: 30, msg: "Cuando compartes generosamente lo que Dios te ha dado, tu propia vida se enriquece; al bendecir a otros, serás bendecido.", ref: "Proverbios 11:25" },
            { m: 10, d: 31, msg: "La verdadera belleza a los ojos de Dios no reside en adornos externos, sino en la serenidad inquebrantable de tu espíritu.", ref: "1 Pedro 3:3-4" },
            { m: 11, d: 1, msg: "Levántate y resplandece, porque la luz de Dios ha amanecido sobre ti y Su claridad te guiará.", ref: "Isaías 60:1" },
            { m: 11, d: 2, msg: "A veces el silencio es la mejor respuesta; en la quietud y en la confianza en Dios encontrarás tu mayor fortaleza.", ref: "Isaías 30:15" },
            { m: 11, d: 3, msg: "No devuelvas mal por mal; deja la justicia en manos de Dios y enfócate en vencer la negatividad haciendo el bien.", ref: "Romanos 12:17-21" },
            { m: 11, d: 4, msg: "Las dificultades presentes no se comparan en absoluto con la gloria que Dios está a punto de revelar en tu vida.", ref: "Romanos 8:18" },
            { m: 11, d: 5, msg: "La compasión de Dios no tiene fin; Sus misericordias son nuevas cada mañana y te abrazan con cada amanecer.", ref: "Lamentaciones 3:22-23" },
            { m: 11, d: 6, msg: "Si te falta sabiduría para tomar una decisión, pídela con fe a Dios, quien da a todos generosamente y sin reproches.", ref: "Santiago 1:5" },
            { m: 11, d: 7, msg: "Las palabras tienen el poder de dar vida o destruir; usa el lenguaje que Dios te dio para construir puentes y sanar heridas.", ref: "Proverbios 18:21" },
            { m: 11, d: 8, msg: "Es mejor vivir con poco y en paz con Dios, que rodeado de inmensas riquezas en medio del tormento y la intranquilidad.", ref: "Proverbios 15:16" },
            { m: 11, d: 9, msg: "Que la esperanza en Dios sea tu ancla; mantente paciente en el dolor y constante en la gratitud y la oración.", ref: "Romanos 12:12" },
            { m: 11, d: 10, msg: "El amor perfecto de Dios expulsa el temor. Donde Él habita por completo, el miedo pierde todo su poder sobre ti.", ref: "1 Juan 4:18" },
            { m: 11, d: 11, msg: "Aprende a perdonar a los demás exactamente de la misma manera compasiva en que Dios te ha perdonado a ti.", ref: "Colosenses 3:13" },
            { m: 11, d: 12, msg: "Dios está íntimamente cerca de los que tienen el corazón roto y rescata a aquellos cuyo espíritu ha sido aplastado.", ref: "Salmo 34:18" },
            { m: 11, d: 13, msg: "La palabra de Dios es una lámpara brillante que ilumina tus pasos cuando caminas por los senderos de la incertidumbre.", ref: "Salmo 119:105" },
            { m: 11, d: 14, msg: "No midas tu valor por lo que posees; Dios te recuerda que la verdadera esencia de la vida trasciende las cosas materiales.", ref: "Lucas 12:15" },
            { m: 11, d: 15, msg: "Da con alegría y sin reservas; Dios sonríe y bendice profundamente a quien comparte lo suyo con un corazón dispuesto.", ref: "2 Corintios 9:7" },
            { m: 11, d: 16, msg: "Dios guardará tu mente en completa paz si mantienes tus pensamientos enfocados en Él y confías en Su proceso.", ref: "Isaías 26:3" },
            { m: 11, d: 17, msg: "Trata a las demás personas con la misma gracia y misericordia con las que Dios te pide que ames a tu prójimo.", ref: "Lucas 6:31" },
            { m: 11, d: 18, msg: "El orgullo siempre precede a la caída; caminar con la humildad que Dios enseña te mantendrá firme en momentos resbaladizos.", ref: "Proverbios 16:18" },
            { m: 11, d: 19, msg: "Incluso una fe pequeña, pero genuinamente puesta en Dios, es suficiente para mover montañas y transformar realidades.", ref: "Mateo 17:20" },
            { m: 11, d: 20, msg: "Dios te dio dos oídos y una boca: sé rápido para escuchar a los demás, lento para hablar y aún más lento para enojarte.", ref: "Santiago 1:19" },
            { m: 11, d: 21, msg: "Que todo lo verdadero, noble, justo, puro y amable que proviene de Dios ocupe el espacio principal en tu mente.", ref: "Filipenses 4:8" },
            { m: 11, d: 22, msg: "Dios te ha encendido para ser luz en el mundo; no escondas tu brillo, ilumina a quienes te rodean con Sus acciones.", ref: "Mateo 5:14-16" },
            { m: 11, d: 23, msg: "Confía en la provisión de Dios y no te angusties por el mañana; céntrate en vivir plenamente y hacer el bien hoy.", ref: "Mateo 6:34" },
            { m: 11, d: 24, msg: "Los planes puestos en las manos de Dios y el trabajo honesto llevan a la abundancia; la prisa ansiosa solo trae vacío.", ref: "Proverbios 21:5" },
            { m: 11, d: 25, msg: "Con la ayuda de Dios, aquel que domina su propio carácter es mucho más poderoso que quien conquista una ciudad entera.", ref: "Proverbios 16:32" },
            { m: 11, d: 26, msg: "Dios te fortalece para estar contento en cualquier situación, encontrando paz interior tanto en la escasez como en la abundancia.", ref: "Filipenses 4:11-12" },
            { m: 11, d: 27, msg: "Mantén firme la esperanza que profesas, porque Dios, quien te prometió un futuro brillante, es eternamente fiel a Su palabra.", ref: "Hebreos 10:23" },
            { m: 11, d: 28, msg: "Caminar con Dios es la mayor de las riquezas, especialmente cuando tu espíritu sabe sentirse satisfecho y agradecido.", ref: "1 Timoteo 6:6" },
            { m: 11, d: 29, msg: "Da un paso hacia Dios con el corazón sincero, y Él acortará la distancia acercándose a ti con amor infinito.", ref: "Santiago 4:8" },
            { m: 11, d: 30, msg: "Esfuérzate por vivir en paz y busca la pureza de corazón; porque sin esa limpieza interior es difícil ver a Dios actuando.", ref: "Hebreos 12:14" },
            { m: 12, d: 1, msg: "Cuando tus decisiones agradan a Dios y se alinean con Su bien, Él hace que incluso tus adversarios encuentren paz contigo.", ref: "Proverbios 16:7" },
            { m: 12, d: 2, msg: "La alegría que Dios pone en tu corazón es la mejor medicina, mientras que un espíritu abatido consume tu vitalidad.", ref: "Proverbios 17:22" },
            { m: 12, d: 3, msg: "No te canses de hacer el bien; a su debido tiempo, si no te rindes, Dios te permitirá recoger una cosecha abundante.", ref: "Gálatas 6:9" },
            { m: 12, d: 4, msg: "Como alguien profundamente amado por Dios, vístete cada día de compasión, amabilidad, humildad, dulzura y paciencia.", ref: "Colosenses 3:12" },
            { m: 12, d: 5, msg: "La verdadera sabiduría en la vida comienza cuando reconoces con profundo respeto y reverencia la grandeza de Dios.", ref: "Proverbios 9:10" },
            { m: 12, d: 6, msg: "Aunque tu cuerpo exterior se desgaste, el Espíritu de Dios renueva y fortalece tu ser interior día tras día.", ref: "2 Corintios 4:16" },
            { m: 12, d: 7, msg: "Confía en que Dios, quien comenzó una buena obra en ti, no te abandonará; Él te guiará hasta perfeccionarla.", ref: "Filipenses 1:6" },
            { m: 12, d: 8, msg: "La grandeza para Dios no está en ser servido, sino en usar tu vida para servir y amar a los demás genuinamente.", ref: "Marcos 10:43-45" },
            { m: 12, d: 9, msg: "Si permaneces unido a Dios, darás mucho fruto; porque separado de Su fuerza, tus esfuerzos pierden su verdadero impacto.", ref: "Juan 15:5" },
            { m: 12, d: 10, msg: "Observa cómo Dios cuida con perfección de las aves y las flores; ten por seguro que Él cuidará de ti con mayor devoción.", ref: "Mateo 6:26" },
            { m: 12, d: 11, msg: "Pon todas tus obras y proyectos en las manos de Dios, y verás cómo Él se encarga de afirmar tus propósitos.", ref: "Proverbios 16:3" },
            { m: 12, d: 12, msg: "Que tu amor sea sin hipocresía; aborrece lo que daña el alma y aférrate con fuerza a lo que Dios llama bueno.", ref: "Romanos 12:9" },
            { m: 12, d: 13, msg: "Recuerda las palabras de Jesús: siempre hay más felicidad, propósito y bendición en dar que en recibir.", ref: "Hechos 20:35" },
            { m: 12, d: 14, msg: "Las palabras guiadas por la sabiduría de Dios traen sanidad, mientras que la precipitación hiere profundamente el alma.", ref: "Proverbios 12:18" },
            { m: 12, d: 15, msg: "Mantén la mirada fija en las promesas de Dios; lo que ven tus ojos es temporal, pero lo que Él te ofrece es eterno.", ref: "2 Corintios 4:18" },
            { m: 12, d: 16, msg: "Una respuesta apacible apaga los incendios del orgullo y refleja el carácter tranquilo que Dios desea formar en ti.", ref: "Proverbios 15:1" },
            { m: 12, d: 17, msg: "Anímense y edifíquense mutuamente; cuando eres instrumento de Dios para levantar a otro, Él te levanta a ti también.", ref: "1 Tesalonicenses 5:11" },
            { m: 12, d: 18, msg: "Que tus conversaciones reflejen la gracia de Dios; habla siempre con amabilidad, sazonando tus palabras con empatía y sabiduría.", ref: "Colosenses 4:6" },
            { m: 12, d: 19, msg: "No desesperes ante la injusticia del mundo; Dios traerá a la luz toda acción y revelará el verdadero peso de cada corazón.", ref: "Eclesiastés 12:14" },
            { m: 12, d: 20, msg: "Aquel que camina con la integridad que Dios manda avanza seguro; el que toma caminos torcidos tropezará consigo mismo.", ref: "Proverbios 10:9" },
            { m: 12, d: 21, msg: "Pídele a Dios que te enseñe a valorar el tiempo, para que vivas cada uno de tus días con sabiduría y propósito.", ref: "Salmo 90:12" },
            { m: 12, d: 22, msg: "Alégrate siempre, ora a Dios sin cesar y sé agradecido en cada circunstancia; esta es Su voluntad perfecta para ti.", ref: "1 Tesalonicenses 5:16-18" },
            { m: 12, d: 23, msg: "El mayor regalo de Dios no llegó envuelto en oro, sino en forma de salvación, esperanza y luz para los rincones más oscuros.", ref: "Lucas 2:10-11" },
            { m: 12, d: 24, msg: "Hoy es el recordatorio supremo de que Dios amó tanto al mundo, que entregó lo más valioso para que tuvieras vida eterna.", ref: "Juan 3:16" },
            { m: 12, d: 25, msg: "Tus ojos son la lámpara de tu cuerpo; si miras el mundo a través del amor de Dios, todo tu ser resplandecerá de luz.", ref: "Mateo 6:22" },
            { m: 12, d: 26, msg: "Dios no te diseñó para el aislamiento; si caes, un compañero puesto en tu camino estará ahí para ayudarte a levantar.", ref: "Eclesiastés 4:9-10" },
            { m: 12, d: 27, msg: "Antes de juzgar a los demás, pídele a Dios que te muestre tus propios errores; saca primero el obstáculo de tu propio ojo.", ref: "Mateo 7:3-5" },
            { m: 12, d: 28, msg: "Las batallas más importantes no se ganan con fuerza humana, sino dejándote guiar plenamente por el Espíritu de Dios.", ref: "Zacarías 4:6" },
            { m: 12, d: 29, msg: "Mientras más humilde seas, más Dios te enaltecerá; Él honra profundamente a quienes reconocen su pequeñez ante Su grandeza.", ref: "Mateo 23:12" },
            { m: 12, d: 30, msg: "Olvida los fracasos que quedan atrás y extiéndete hacia lo que está adelante; confía en el nuevo comienzo que Dios te da hoy.", ref: "Filipenses 3:13" },
            { m: 12, d: 31, msg: "Observa con atención, porque Dios está haciendo algo completamente nuevo en tu vida. ¿Acaso no lo percibes brotando ya?", ref: "Isaías 43:19" },
            { m: 1, d: 1, msg: "Echa sobre los hombros de Dios toda tu carga de ansiedad, sabiendo profundamente que Él tiene cuidado de ti en todo momento.", ref: "1 Pedro 5:7" },
            { m: 1, d: 2, msg: "Las misericordias de Dios te sostienen y no caducan; son nuevas esta mañana y te acompañarán cada día de este nuevo año.", ref: "Lamentaciones 3:22-23" },
            { m: 1, d: 3, msg: "No seas vencido por la negatividad del entorno; sé un instrumento de Dios para vencer el mal haciendo constantemente el bien.", ref: "Romanos 12:21" },
            { m: 1, d: 4, msg: "Es en tu propia debilidad donde el poder de Dios encuentra el lugar perfecto para manifestarse y hacerte invencible.", ref: "2 Corintios 12:9" },
            { m: 1, d: 5, msg: "Que Dios llene tu corazón de gozo y paz a través de la fe, para que tu esperanza desborde y cambie tu entorno.", ref: "Romanos 15:13" },
            { m: 1, d: 6, msg: "Guarda silencio ante la presencia de Dios y espera en Él con paciencia; Su tiempo es perfecto, confía en Su voluntad.", ref: "Salmo 37:7" },
            { m: 1, d: 7, msg: "El Señor es mi pastor, nada me faltará. En lugares de delicados pastos me hará descansar; junto a aguas de reposo me pastoreará.", ref: "Salmo 23:1-2" }
        ];

        // 16 Gradientes CSS de tonos medios a oscuros (elegantes y profundos para destacar el texto blanco)
        const gradients = [
            'linear-gradient(135deg, #2b5876 0%, #4e4376 100%)', // 0: Azul/Morado apagado
            'linear-gradient(135deg, #cc2b5e 0%, #753a88 100%)', // 1: Magenta profundo a Púrpura
            'linear-gradient(135deg, #0ba360 0%, #3cba92 100%)', // 2: Verde Medio/Esmeralda
            'linear-gradient(135deg, #d38312 0%, #a83279 100%)', // 3: Naranja quemado a Ciruela
            'linear-gradient(135deg, #4cb8c4 0%, #3cd3ad 100%)', // 4: Turquesa medio
            'linear-gradient(135deg, #141e30 0%, #243b55 100%)', // 5: Pizarra oscuro
            'linear-gradient(135deg, #8e2de2 0%, #4a00e0 100%)', // 6: Violeta profundo
            'linear-gradient(135deg, #314755 0%, #26a0da 100%)', // 7: Gris acero a Azul
            'linear-gradient(135deg, #c31432 0%, #240b36 100%)', // 8: Carmesí a Nocturno
            'linear-gradient(135deg, #cb2d3e 0%, #ef473a 100%)', // 9: Rojo terracota
            'linear-gradient(135deg, #00b4db 0%, #0083b0 100%)', // 10: Cerceta oscuro (Teal)
            'linear-gradient(135deg, #3a1c71 0%, #d76d77 100%)', // 11: Morado a Malva
            'linear-gradient(135deg, #005c97 0%, #363795 100%)', // 12: Azul Profundo
            'linear-gradient(135deg, #4568dc 0%, #b06ab3 100%)', // 13: Azul a Rosa medio
            'linear-gradient(135deg, #136a8a 0%, #267871 100%)', // 14: Verde Mar oscuro
            'linear-gradient(135deg, #b92b27 0%, #1565c0 100%)'  // 15: Rojo oscuro a Azul marino
        ];

        let currentIndex = 0;
        let todayIndex = 0;

        const tabHoy = document.getElementById('tab-hoy');
        const tabPasadas = document.getElementById('tab-pasadas');
        const viewHoy = document.getElementById('view-hoy');
        const viewPasadas = document.getElementById('view-pasadas');
        const postContainer = document.getElementById('post-capture-area');
        const postMessage = document.getElementById('post-message');
        const postReference = document.getElementById('post-reference');
        const dateLabel = document.getElementById('display-date-label');
        const pastGrid = document.getElementById('past-grid');
        
        function initApp() {
            const today = new Date();
            const currentMonth = today.getMonth() + 1;
            const currentDay = today.getDate();

            todayIndex = quotes.findIndex(q => q.m === currentMonth && q.d === currentDay);
            if (todayIndex === -1) todayIndex = 0; // Si no hay frase, usa la primera (29 Sep) por defecto

            loadQuote(todayIndex);
            renderPastQuotes(todayIndex);

            tabHoy.addEventListener('click', () => switchTab('hoy'));
            tabPasadas.addEventListener('click', () => switchTab('pasadas'));
            
            document.getElementById('copyBtn').addEventListener('click', handleCopy);
            document.getElementById('downloadBtn').addEventListener('click', handleDownload);
            document.getElementById('shareBtn').addEventListener('click', handleShare);
        }

        function loadQuote(index) {
            currentIndex = index;
            const quote = quotes[index];
            
            postMessage.textContent = quote.msg;
            postReference.textContent = quote.ref;
            
            const monthNames = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
            const isToday = index === todayIndex;
            dateLabel.textContent = isToday ? "Frase de Hoy" : `${quote.d} de ${monthNames[quote.m - 1]}`;

            const gradientIndex = index % 16;
            postContainer.style.background = gradients[gradientIndex];
        }

        function renderPastQuotes(maxIndex) {
            pastGrid.innerHTML = '';
            
            if (maxIndex === 0) {
                document.getElementById('no-past-msg').classList.remove('hidden');
                pastGrid.classList.add('hidden');
                return;
            }

            const monthNames = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];

            for (let i = maxIndex - 1; i >= 0; i--) {
                const q = quotes[i];
                const card = document.createElement('div');
                const gradientIndex = i % 16;
                
                card.className = `cursor-pointer rounded-xl p-3 shadow-sm hover:shadow-md transform transition hover:-translate-y-1 flex flex-col justify-between aspect-square text-white`;
                card.style.background = gradients[gradientIndex];
                
                card.innerHTML = `
                    <div class="text-[10px] font-bold uppercase tracking-wide opacity-90 mb-1">
                        ${q.d} ${monthNames[q.m - 1]}
                    </div>
                    <div class="font-serif line-clamp-4 text-xs font-semibold italic flex-grow flex items-center text-center leading-tight">
                        "${q.msg}"
                    </div>
                `;
                
                card.addEventListener('click', () => {
                    loadQuote(i);
                    switchTab('hoy');
                });
                
                pastGrid.appendChild(card);
            }
        }

        function switchTab(tab) {
            if (tab === 'hoy') {
                viewHoy.classList.remove('hidden');
                viewPasadas.classList.add('hidden');
                tabHoy.className = "px-6 py-2 border-b-2 border-blue-600 text-blue-600 font-bold transition-colors";
                tabPasadas.className = "px-6 py-2 border-b-2 border-transparent text-gray-400 hover:text-gray-700 font-bold transition-colors";
            } else {
                viewHoy.classList.add('hidden');
                viewPasadas.classList.remove('hidden');
                tabPasadas.className = "px-6 py-2 border-b-2 border-blue-600 text-blue-600 font-bold transition-colors";
                tabHoy.className = "px-6 py-2 border-b-2 border-transparent text-gray-400 hover:text-gray-700 font-bold transition-colors";
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `show ${type}`;
            setTimeout(() => { toast.className = toast.className.replace("show", "").trim(); }, 4000);
        }

        async function getCanvasBlob() {
            const canvas = await html2canvas(postContainer, { scale: 2, useCORS: true, backgroundColor: null });
            return new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
        }

        async function handleCopy() {
            const btn = document.getElementById('copyBtn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = 'Copiando...';
            btn.disabled = true;

            try {
                const blob = await getCanvasBlob();
                const item = new ClipboardItem({ 'image/png': blob });
                await navigator.clipboard.write([item]);
                showToast("¡Imagen copiada al portapapeles!", "success");
            } catch (err) {
                console.error(err);
                showToast("Error de permisos. Usa la opción Descargar.", "error");
            } finally {
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }
        }

        async function handleDownload() {
            const btn = document.getElementById('downloadBtn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = 'Descargando...';
            btn.disabled = true;

            try {
                const blob = await getCanvasBlob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Frase_${quotes[currentIndex].d}_NabbyMinisterio.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast("¡Imagen descargada con éxito!", "success");
            } catch (err) {
                console.error(err);
                showToast("Error al generar la descarga.", "error");
            } finally {
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }
        }

        async function handleShare() {
            const btn = document.getElementById('shareBtn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = 'Preparando...';
            btn.disabled = true;

            try {
                const blob = await getCanvasBlob();
                const file = new File([blob], `Frase_${quotes[currentIndex].d}.png`, { type: 'image/png' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: 'Reflexión Diaria - Nabby Ministerio',
                        text: `"${quotes[currentIndex].msg}"\n\n#NabbyMinisterio #NecesitoDeDios`
                    });
                } else {
                    showToast("Tu navegador no soporta compartir directamente. Descarga la imagen en su lugar.", "error");
                }
            } catch (err) {
                if (err.name !== "AbortError") {
                    console.error(err);
                    showToast("Ocurrió un error al intentar compartir.", "error");
                }
            } finally {
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
